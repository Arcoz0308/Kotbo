-- Extrait de config Conky (~/.config/conky/conky.conf)
--
-- ${texeci INTERVALLE_SECONDES script} exécute le script en arrière-plan et
-- met son résultat en cache pendant l'intervalle donné (900s = 15 min).
-- Ajoute ce bloc dans ta section conky.text existante.

conky.text = [[
${color grey}${texeci 900 ~/.config/conky/kotbo-conky-fetch.sh}
]];
