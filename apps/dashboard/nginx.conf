server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://beta-api.kotbo.fr wss://beta-api.kotbo.fr https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; frame-src https://beta-api.kotbo.fr; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    
    # Modifié de 'same-origin' à 'same-site' pour autoriser la communication avec beta-api.kotbo.fr
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # SPA routing: fallback to index.html for non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not fallback API paths to index.html; return an explicit deployment error instead.
    location ^~ /api/ {
        default_type application/json;
        return 502 '{"error":"Backend API non disponible depuis le conteneur dashboard. Configurez VITE_API_URL ou un reverse proxy /api vers le service bot."}';
    }

    # Prevent caching of the service worker
    location = /sw.js {
        log_not_found off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Static assets can be cached aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
