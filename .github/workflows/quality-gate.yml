name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-bot:
    name: Bot Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run bot quality gate
        env:
          KOTBO_COVERAGE_LINES: "90"
          KOTBO_COVERAGE_FUNCS: "80"
        run: bun run quality:bot
